[tox]
envlist = py313, py314, lint, typing
skip_missing_interpreters = True

[gh-actions]
python =
    3.13: py313, lint, typing
    3.14: py314, lint, typing

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-homeassistant-custom-component
    PyTurboJPEG
commands =
    pytest --ignore=tests/e2e {posargs} tests

[testenv:lint]
basepython = {env:PYTHON3_PATH:python3}
deps =
    ruff
commands =
    ruff check custom_components tests
    ruff format --check custom_components tests

[testenv:typing]
basepython = {env:PYTHON3_PATH:python3}
deps =
    mypy
    types-requests
    homeassistant-stubs
    zm-py==0.5.5
commands =
    mypy custom_components/zoneminder

# Live tests against a running ZoneMinder (e.g. zm-holodeck); see tests/e2e/README.md.
# Pick the zm-py under test with ZM_PY (any pip requirement), e.g.
#   ZM_PY="zm-py==0.5.5" tox -e e2e
#   ZM_PY="git+https://github.com/rohankapoorcom/zm-py@develop" tox -e e2e
# Uncommitted edits in a local checkout: tox -e e2e-local (ZM_PY_SRC, default ../zm-py).
[e2e]
deps =
    pytest
    pytest-asyncio
    pytest-homeassistant-custom-component
    PyTurboJPEG
passenv =
    ZM_*
commands =
    pip show zm-py
    pytest {posargs:tests/e2e -v -rs}

[testenv:e2e]
package = skip
deps =
    {[e2e]deps}
    {env:ZM_PY:zm-py==0.5.6}
passenv = {[e2e]passenv}
commands = {[e2e]commands}

[testenv:e2e-local]
package = skip
deps =
    {[e2e]deps}
    -e {env:ZM_PY_SRC:../zm-py}
passenv = {[e2e]passenv}
commands = {[e2e]commands}
